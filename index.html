<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Panitia</title>
    <!-- Memanggil Library Supabase langsung dari internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Sistem Keuangan Panitia</h1>
    <button onclick="testKoneksi()">Test Tarik Data Divisi</button>
    <ul id="hasil"></ul>

    <script>
        // MASUKKAN KUNCI API SUPABASE ANDA DI SINI
        const SUPABASE_URL = 'https://nffrxxkydlsvtbliqalv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZnJ4eGt5ZGxzdnRibGlxYWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzI1NTcsImV4cCI6MjEwNDQwODU1N30.s5YBFQ7W1KRKba3MMRFl-q42nRRApak_3QLd7S4B85A'; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testKoneksi() {
            // Mengambil data dari tabel 'divisions'
            const { data, error } = await supabase.from('divisions').select('*');
            
            const ul = document.getElementById('hasil');
            ul.innerHTML = '';

            if (error) {
                ul.innerHTML = '<li>Error: ' + error.message + '</li>';
            } else {
                data.forEach(divisi => {
                    ul.innerHTML += '<li>' + divisi.name + '</li>';
                });
            }
        }
    </script>
</body>
</html>
