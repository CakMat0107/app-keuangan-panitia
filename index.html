<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Panitia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 500px; margin-top: 5vh;">
    
    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="card shadow">
      <div class="card-body p-4">
        <h4 class="text-center mb-4 text-primary fw-bold">Login Keuangan</h4>
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Contoh: admin / konsumsi">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button class="btn btn-primary w-100 fw-bold" id="btnLogin" onclick="prosesLogin()">Masuk</button>
        <div id="loginStatus" class="mt-3 text-danger text-center fw-bold"></div>
      </div>
    </div>

    <!-- HALAMAN ADMIN -->
    <div id="adminSection" class="card shadow" style="display: none;">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
          <h4 class="text-primary fw-bold mb-0">Dashboard Admin</h4>
          <button class="btn btn-outline-danger btn-sm fw-bold" onclick="logout()">Logout</button>
        </div>
        <div class="alert alert-info">Selamat datang, <strong>Admin</strong>! Data Pagu akan muncul di sini.</div>
      </div>
    </div>

    <!-- HALAMAN BENDAHARA -->
    <div id="bendaharaSection" class="card shadow" style="display: none;">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
          <h4 class="text-success fw-bold mb-0">Input Realisasi</h4>
          <button class="btn btn-outline-danger btn-sm fw-bold" onclick="logout()">Logout</button>
        </div>
        <div class="alert alert-success">Selamat datang, Divisi <strong><span id="namaDivisi"></span></strong>! Form nota akan muncul di sini.</div>
      </div>
    </div>

  </div>

  <script>
    // URL dan Key Anda (sudah benar)
    const SUPABASE_URL = 'https://nffrxxkydlsvtbliqalv.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZnJ4eGt5ZGxzdnRibGlxYWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzI1NTcsImV4cCI6MjEwNDQwODU1N30.s5YBFQ7W1KRKba3MMRFl-q42nRRApak_3QLd7S4B85A'; 
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
      const savedUser = sessionStorage.getItem('userData');
      if(savedUser) tampilkanHalaman(JSON.parse(savedUser));
    };

    async function prosesLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnLogin');
      const status = document.getElementById('loginStatus');
      
      if(!user || !pass) {
        status.innerText = "Isi username dan password!";
        return;
      }

      btn.innerText = "Memeriksa..."; btn.disabled = true; status.innerText = "";

      try {
        const { data, error } = await supabase
          .from('app_users')
          .select('id, username, role, division_id, divisions(name)')
          .eq('username', user)
          .eq('password', pass);

        if (error) throw new Error("Gagal menghubungi server.");
        if (!data || data.length === 0) throw new Error("Username atau password salah!");

        const userAsli = data[0]; // Ambil data pertama
        const userData = {
          id: userAsli.id,
          role: userAsli.role,
          division_id: userAsli.division_id,
          division_name: userAsli.divisions ? userAsli.divisions.name : null
        };
        
        sessionStorage.setItem('userData', JSON.stringify(userData));
        tampilkanHalaman(userData);

      } catch (err) {
        status.innerText = err.message;
      } finally {
        btn.innerText = "Masuk"; btn.disabled = false;
      }
    }

    function tampilkanHalaman(userData) {
      document.getElementById('loginSection').style.display = 'none';
      if (userData.role === 'admin') {
        document.getElementById('adminSection').style.display = 'block';
      } else if (userData.role === 'bendahara') {
        document.getElementById('bendaharaSection').style.display = 'block';
        document.getElementById('namaDivisi').innerText = userData.division_name;
      }
    }

    function logout() {
      sessionStorage.removeItem('userData');
      location.reload();
    }
  </script>
</body>
</html>
