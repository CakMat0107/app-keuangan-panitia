<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Keuangan Panitia</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light p-4">

  <div class="max-w-md mx-auto" style="max-width: 500px; margin: auto;">
    
    <!-- SECTION 1: FORM LOGIN -->
    <div id="loginSection" class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">Login Panitia</h4>
        <div class="mb-3">
          <label>Username</label>
          <input type="text" id="username" class="form-control">
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button class="btn btn-primary w-100" id="btnLogin" onclick="prosesLogin()">Login</button>
        <div id="loginStatus" class="mt-3 text-danger text-center fw-bold"></div>
      </div>
    </div>

    <!-- SECTION 2: DASHBOARD ADMIN -->
    <div id="adminSection" class="card shadow-sm" style="display: none;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="card-title text-primary mb-0">Dashboard Admin</h4>
          <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
        <p>Selamat datang, <strong>Admin</strong>!</p>
        <div class="alert alert-info">
          Nantinya tabel rekapitulasi realisasi semua bagian akan muncul di sini.
        </div>
      </div>
    </div>

    <!-- SECTION 3: DASHBOARD BENDAHARA -->
    <div id="bendaharaSection" class="card shadow-sm" style="display: none;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="card-title mb-0">Input Realisasi</h4>
          <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
        <p>Selamat datang, Bendahara <strong><span id="namaDivisi" class="text-primary"></span></strong>!</p>
        <div class="alert alert-success">
          Nantinya form upload nota belanja akan muncul di sini.
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. INISIALISASI SUPABASE (PASTIKAN MENGISI KUNCI API ANDA)
    const SUPABASE_URL = 'https://nffrxxkydlsvtbliqalv.supabase.co/'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZnJ4eGt5ZGxzdnRibGlxYWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzI1NTcsImV4cCI6MjEwNDQwODU1N30.s5YBFQ7W1KRKba3MMRFl-q42nRRApak_3QLd7S4B85A'; 
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. CEK SESI LOGIN SAAT HALAMAN DIBUKA
    window.onload = function() {
      const savedUser = sessionStorage.getItem('userData');
      if(savedUser) {
        tampilkanHalaman(JSON.parse(savedUser));
      }
    };

    // 3. FUNGSI PROSES LOGIN
    async function prosesLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const status = document.getElementById('loginStatus');
      
      if(!user || !pass) {
        status.innerText = "Username dan Password harus diisi!";
        return;
      }

      btn.innerText = "Mengecek...";
      btn.disabled = true;
      status.innerText = "";

      try {
        // Query ke tabel app_users di Supabase
        // Kita mengambil data user sekaligus nama divisinya (relasi tabel)
        const { data, error } = await supabase
          .from('app_users')
          .select(`
            id, 
            username, 
            role, 
            division_id, 
            divisions (name)
          `)
          .eq('username', user)
          .eq('password', pass)
          .single(); // single() berarti kita hanya mencari 1 data yang persis sama

        if (error || !data) {
          throw new Error("Username atau Password salah!");
        }

        // Jika berhasil, simpan data ke sessionStorage
        const userData = {
          id: data.id,
          username: data.username,
          role: data.role,
          division_id: data.division_id,
          division_name: data.divisions ? data.divisions.name : null
        };
        
        sessionStorage.setItem('userData', JSON.stringify(userData));
        tampilkanHalaman(userData);

      } catch (err) {
        status.innerText = err.message;
      } finally {
        btn.innerText = "Login";
        btn.disabled = false;
      }
    }

    // 4. FUNGSI MENGATUR TAMPILAN HALAMAN (ROUTING SEDERHANA)
    function tampilkanHalaman(userData) {
      // Sembunyikan form login
      document.getElementById('loginSection').style.display = 'none';

      // Tampilkan berdasarkan Role
      if (userData.role === 'admin') {
        document.getElementById('adminSection').style.display = 'block';
      } else if (userData.role === 'bendahara') {
        document.getElementById('bendaharaSection').style.display = 'block';
        document.getElementById('namaDivisi').innerText = userData.division_name;
      }
    }

    // 5. FUNGSI LOGOUT
    function logout() {
      sessionStorage.removeItem('userData');
      location.reload(); // Refresh halaman
    }
  </script>
</body>
</html>
